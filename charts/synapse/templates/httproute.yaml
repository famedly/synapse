{{- if .Values.gateway.enabled }}
{{- $mainSvc := include "synapse.componentFullname" (dict "root" $ "component" "main") }}
{{- $hostnames := .Values.gateway.hostnames }}
{{- if and (not $hostnames) .Values.serverName }}{{- $hostnames = list .Values.serverName }}{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "synapse.fullname" . }}
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.parentRef.name is required when gateway.enabled" .Values.gateway.parentRef.name }}
      {{- with .Values.gateway.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.workers.enabled }}
    {{- range $g := .Values.workers.groups }}
    {{- $info := fromYaml (include "synapse.groupInfo" (dict "root" $ "group" $g)) }}
    {{- if $info.routed }}
    - matches:
        {{- range $ep := $info.endpoints }}
        - path:
            type: RegularExpression
            value: {{ include "synapse.pathRegex" $ep | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "synapse.componentFullname" (dict "root" $ "component" $g.name) }}
          port: 8008
    {{- end }}
    {{- end }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $mainSvc }}
          port: 8008
{{- end }}
