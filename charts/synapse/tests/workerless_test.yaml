suite: workerless deployment
templates:
  - templates/statefulset-main.yaml
  - templates/service.yaml
  - templates/httproute.yaml
  - templates/statefulset-worker.yaml
set:
  serverName: matrix.example.com
  config.settings.server_name: matrix.example.com
  secrets.existingSecret: synapse-secrets
  gateway.parentRef.name: matrix-gateway
capabilities:
  majorVersion: "1"
  minorVersion: "36"
tests:
  - it: renders a single main StatefulSet
    template: templates/statefulset-main.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-synapse-main
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.podManagementPolicy
          value: OrderedReady
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["python", "-m", "synapse.app.homeserver"]

  - it: main probes /health on the client port
    template: templates/statefulset-main.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8008
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health

  - it: hardens the container (RO rootfs, drop caps, no privilege escalation)
    template: templates/statefulset-main.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]

  - it: does not set runAsUser by default (OpenShift-safe)
    template: templates/statefulset-main.yaml
    asserts:
      - isNull:
          path: spec.template.spec.securityContext.runAsUser
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: creates no worker StatefulSets when workers are disabled
    template: templates/statefulset-worker.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: routes everything to main via a catch-all
    template: templates/httproute.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: PathPrefix
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-synapse-main

  - it: main Service is headless and publishes not-ready addresses
    template: templates/service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
