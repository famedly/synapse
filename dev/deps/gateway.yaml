# Gateway API Gateway backed by Istio, for the dev harness. Istio provisions a
# Deployment + Service named "<name>-istio" that the Tiltfile port-forwards.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: matrix-gateway
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
